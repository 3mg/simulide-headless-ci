[env:digispark]
platform = atmelavr
board = digispark-tiny
framework = arduino
upload_protocol = micronucleus
upload_flags =
    --timeout
    60

lib_deps =
    puuu/USIWire @ ^0.2.0

build_flags =
    -DMY_ADDRESS=0x10

; ── Варианты конфигурации P3 ─────────────────────────────────────────────────
; По умолчанию: P3 = TinyDebugSerial TX (отладка через UART-адаптер)
; Для кнопки энкодера: раскомментируй строку ниже
; build_flags = -DMY_ADDRESS=0x10 -DENCODER_SW_ON_P3
